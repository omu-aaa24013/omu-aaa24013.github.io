<!DECTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>✈️おすすめの旅行先</title>
  </head>
  <body>
    <h2>BMI指標計算</h2>
<form oninput="bmi.value = Math.round(Number(weight.value) / Math.pow(Number(height.value)/100, 2) * 10) / 10">
    <p><label>体重(kg)：<input name="weight" type="number" step="any"></label></p>
    <p><label>身長(cm)：<input name="height" type="number" step="any"></label></p>
    <p><label>BMI：<output name="bmi"></output></label></p>
</form>
    <h1>🔔おすすめの旅行先を紹介</h1>
    <div>
      <h2>🐄北海道</h2>
      <img src="時計台.webp"width="300"alt="時計台">
      <h3>✅おすすめの理由</h3>
      <ul>
        <li><b>🍚ご飯が美味しい</b></li>
        <p>基本的に何を食べてもおいしい。<br>海鮮も野菜も新鮮でどれも感動するおいしさ。</p>
        <li><b>🌃景色が綺麗</b></li>
        <p>木々の緑や、夜景、雪景色など絶景スポットがたくさんある。</p>
        <li><b>🌲夏でも涼しい</b></li>
        <p>暑くて外出する気になれない夏も、快適に旅行できる。</p>
      </ul>
    </div>
    </body>
</html>
