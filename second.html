  <body>
    <h1>おすすめの旅行先を紹介</h1>
    <div>
      <h2>北海道</h2>
      <h3>おすすめの理由</h3>
      <ul>
        <li><b>ご飯が美味しい</b></li>
        <p>基本的に何を食べてもおいしい。<br>海鮮も野菜も新鮮でどれも感動するおいしさ。</p>
        <li><b>景色が綺麗</b></li>
        <p>青空に木々の緑や、夜景、雪景色など絶景スポットがたくさんある。</p>
        <li><b>夏でも涼しい</b></li>
        <li><b>冬ではウィンタースポーツも楽しめる</b></li>
      </ul>
    </div>
  </body>
